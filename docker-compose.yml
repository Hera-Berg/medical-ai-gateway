services:
  nginx:
    build: ./infra/nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:8000
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - QDRANT_NODE_1_URL=http://qdrant-node1:6333
      - QDRANT_NODE_2_URL=http://qdrant-node2:6333
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
      - ACTIVE_STORAGE_BACKEND_DEFAULT=local
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-}
      - S3_BUCKET=${S3_BUCKET:-}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant-node1:
        condition: service_started
      qdrant-node2:
        condition: service_started
    restart: unless-stopped

  qdrant-node1:
    image: qdrant/qdrant:v1.10.1
    command: ./qdrant --uri http://qdrant-node1:6335
    environment:
      - QDRANT__CLUSTER__ENABLED=true
    volumes:
      - ${QDRANT_NODE_1_VOLUME:-qdrant_node1_data}:/qdrant/storage
    restart: unless-stopped

  qdrant-node2:
    image: qdrant/qdrant:v1.10.1
    command: ./qdrant --bootstrap http://qdrant-node1:6335 --uri http://qdrant-node2:6335
    environment:
      - QDRANT__CLUSTER__ENABLED=true
    volumes:
      - ${QDRANT_NODE_2_VOLUME:-qdrant_node2_data}:/qdrant/storage
    depends_on:
      - qdrant-node1
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  qdrant_node1_data:
  qdrant_node2_data:
  postgres_data:
