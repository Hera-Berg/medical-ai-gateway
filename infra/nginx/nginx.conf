# Medical AI Gateway — Nginx reverse proxy + load balancer.
# Single entry point inside the Docker network. The Cloudflare tunnel points
# here. Only this service publishes a host port (8090).

events { worker_connections 1024; }

http {
    # ───────────────────────────────────────────────────────────────────────
    # HORIZONTAL SCALING / LOAD BALANCING
    #
    # The backend is stateless, so we run N replicas (docker-compose
    # `deploy.replicas`) and balance across them here.
    #
    # CRITICAL DETAIL: Nginx resolves upstream hostnames ONCE at startup by
    # default. With a static `upstream { server backend:8000; }` block, Nginx
    # caches the single IP it got at boot and never sees new replicas — so
    # scaling wouldn't actually distribute load. To fix that we:
    #   1. point Nginx at Docker's embedded DNS resolver (127.0.0.11), and
    #   2. use a VARIABLE in proxy_pass ($backend_upstream), which forces Nginx
    #      to re-resolve the name per request. Docker's DNS returns all replica
    #      IPs in rotating order, giving round-robin across every live replica.
    #
    # `valid=10s` re-checks DNS every 10s so replicas added/removed at runtime
    # are picked up without an Nginx reload.
    # ───────────────────────────────────────────────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Allow large PDF uploads through to the backend.
        client_max_body_size 50m;

        # ───────────────────────────────────────────────────────────────────
        # SINGLE-PASSWORD GATE (HTTP Basic Auth)
        #
        # Generated at container start from GATEWAY_PASSWORD in .env by
        # /docker-entrypoint.d/00-gateway-auth.sh. Placed here at server scope
        # so it covers EVERY location below (frontend + /api/) with one
        # credential. If GATEWAY_PASSWORD is empty, auth.conf is empty and the
        # gateway is open (for local dev).
        # ───────────────────────────────────────────────────────────────────
        include /etc/nginx/auth.conf;

        # Health check must stay OPEN (no auth): the tunnel / uptime probes hit
        # it, and it exposes nothing sensitive (just liveness).
        location = /health {
            auth_basic off;
            set $backend_health http://backend:8000;
            proxy_pass $backend_health/health;
            proxy_set_header Host $host;
        }

        # API → FastAPI backend replicas (load-balanced via per-request DNS).
        location /api/ {
            # Re-resolved per request -> distributes across all backend replicas.
            set $backend_upstream http://backend:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Long enough for cold starts (weights download + load) AND
            # High-tier 6-pass queries. Must exceed the backend's RunPod read
            # timeout (600s) so nginx doesn't cut the connection first.
            proxy_read_timeout 620s;
        }

        # Everything else → Next.js frontend (single replica; UI is static-ish).
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
